<html style="overscroll-behavior: contain;">
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, user-scalable=no'>
    <meta name='mobile-web-app-capable' content='yes'>
    <meta name='apple-mobile-web-app-capable' content='yes'>
    <link rel='icon' type='image/png' sizes='32x32' href='favicon-32x32.png'>
    <link rel='icon' type='image/png' sizes='96x96' href='favicon-96x96.png'>
    <link rel='stylesheet' href='css/common.css'>

    <title>Barebones WebXR DOM Overlay</title>
  </head>
  <body style="padding:0;">
    <div id="overlay">
      <div id="bottom-edge" style="position: fixed; left: 0; right: 0; bottom: 0; height: 8px; background-color: blue;">
      </div>
      <div id="touch-indicator-x" style="visibility: hidden; position: fixed; left: 0; top: 0; bottom: 0; width: 4px; background-color: rgba(0,128,0,0.5);">
      </div>
      <div id="touch-indicator-y" style="visibility: hidden; position: fixed; left: 0; right: 0; top: 0; height: 4px; background-color: rgba(0,128,0,0.5);">
      </div>
      <header>
        <details open>
          <summary>Barebones WebXR DOM Overlay</summary>
          <p>
            A modified version of the
            <a href="https://immersive-web.github.io/webxr-samples/ar-barebones.html">Barebones AR</a>
            WebXR sample page to help repro <a href="https://issues.chromium.org/issues/474140206">this Chrome bug</a>.
          </p>
          <p>
            <input type="checkbox" id="require-camera-access" />
            <label for="require-camera-access">Add camera-access to requiredFeatures</label>
          </p>
          <p>
            <input type="checkbox" id="delay-after-start" checked />
            <label for="delay-after-start">Add 5s delay in onSessionStarted</label>
          </p>
          <p>
            <input type="text" id="demo-text" inputmode="text" placeholder="Demo Text Field" />
          </p>
          <p>
            WebXR Viewport: <span id="webxr-viewport-span">-</span>
            <br>
            Fullscreen Elem: <span id="fullscreen-client-rect-span">-</span>
            <br>
            Visual Viewport: <span id="visual-viewport-span"></span>
            <br>
            window.screen: <span id="screen-span"></span>
          </p>
          <div id="warning-zone"></div>
          <button id="xr-button" class="barebones-button" disabled>XR not found</button>
        </details>
      </header>
    </div>
    <main style='text-align: center;'>
      <p>Click 'Enter AR' to see content</p>
    </main>
    <script type="module">
      // Touch position indicators
      const touchIndicatorX = document.getElementById('touch-indicator-x');
      const touchIndicatorY = document.getElementById('touch-indicator-y');
      const updateIndicators = (ev) => {
        if(ev.touches.length == 1) {
          touchIndicatorX.style.visibility = 'visible';
          touchIndicatorX.style.left = `${ev.touches.item(0).clientX - 2}px`; 
          touchIndicatorY.style.visibility = 'visible';
          touchIndicatorY.style.top = `${ev.touches.item(0).clientY - 2}px`; 
        } else {
          touchIndicatorX.style.visibility = 'hidden';
          touchIndicatorY.style.visibility = 'hidden';
        }
      }

      window.addEventListener('touchstart', updateIndicators);
      window.addEventListener('touchmove', updateIndicators);
      window.addEventListener('touchend', updateIndicators);
      window.addEventListener('touchcancel', updateIndicators);

      // Measured sizes
      let latestScreenWidth = 0;
      let latestScreenHeight = 0;
      let latestVisualViewportWidth = 0;
      let latestVisualViewportHeight = 0;
      let latestFullscreenWidth = 0;
      let latestFullscreenHeight = 0;
      let latestWebXRViewportWidth = 0;
      let latestWebXRViewportHeight = 0;
      const screenSpan = document.getElementById('screen-span');
      const visualViewportSpan = document.getElementById('visual-viewport-span');
      const fullscreenRectSpan = document.getElementById('fullscreen-client-rect-span');
      const webxrViewportSpan = document.getElementById('webxr-viewport-span');

      const updateSizes = () => {
        let { width, height } = window.screen;
        if(width != latestScreenWidth || height != latestScreenHeight) {
          const dpr = window.devicePixelRatio;
          const sizeText = `${(width * dpr).toFixed(1)} x ${(height * dpr).toFixed(1)} (${width} x ${height})`;
          console.log(`Screen size: ${sizeText}`);
          screenSpan.innerText = sizeText;
          latestScreenWidth = width;
          latestScreenHeight = height;
        }

        if(window.visualViewport) {
          let { width, height } = window.visualViewport;
          if(width != latestVisualViewportWidth || height != latestVisualViewportHeight) {
            const dpr = window.devicePixelRatio;
            const sizeText = `${(width * dpr).toFixed(1)} x ${(height * dpr).toFixed(1)} (${width.toFixed(2)} x ${height.toFixed(2)})`;
            console.log(`Visual viewport size: ${sizeText}`);
            visualViewportSpan.innerText = sizeText;
            latestVisualViewportWidth = width;
            latestVisualViewportHeight = height;
          }
        }

        let fsWidth = 0;
        let fsHeight = 0;
        if(document.fullscreenElement) {
          let clientRect = document.fullscreenElement.getBoundingClientRect();
          fsWidth = clientRect.width;
          fsHeight = clientRect.height;
        }

        if(fsWidth != latestFullscreenWidth || fsHeight != latestFullscreenHeight) {
            const dpr = window.devicePixelRatio;
            let sizeText = '-';
            if(fsWidth > 0 || fsHeight > 0) {
              sizeText = `${(fsWidth * dpr).toFixed(1)} x ${(fsHeight * dpr).toFixed(1)} (${fsWidth.toFixed(2)} x ${fsHeight.toFixed(2)})`;
              console.log(`Fullscreen element client size: ${sizeText}`);
            }
            fullscreenRectSpan.innerText = sizeText;
            latestFullscreenWidth = fsWidth;
            latestFullscreenHeight = fsHeight;
        }
      }
      updateSizes();

      if(window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateSizes);
        window.visualViewport.addEventListener('scroll', updateSizes);
      }


      // XR globals.
      let xrButton = document.getElementById('xr-button');
      let xrSession = null;
      let xrRefSpace = null;
      let xrWebGLLayer = null;

      // WebGL scene globals.
      let gl = null;

      function checkSupportedState() {
        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          if (supported) {
            xrButton.innerHTML = 'Enter AR';
          } else {
            xrButton.innerHTML = 'AR not found';
          }

          xrButton.disabled = !supported;
        });
      }

      function initXR() {
        if (!window.isSecureContext) {
          let message = "WebXR unavailable due to insecure context";
          document.getElementById("warning-zone").innerText = message;
        }

        if (navigator.xr) {
          xrButton.addEventListener('click', onButtonClicked);
          navigator.xr.addEventListener('devicechange', checkSupportedState);
          checkSupportedState();
        }
      }

      function onButtonClicked() {
        if (!xrSession) {
            // Ask for an optional DOM Overlay, see https://immersive-web.github.io/dom-overlays/
            let sessionOptions = {
                optionalFeatures: ['dom-overlay'],
                domOverlay: {root: document.getElementById('overlay')}
            };

            // Optionally add camera-access as a requiredFeature
            if(document.getElementById('require-camera-access').checked) {
              sessionOptions['requiredFeatures'] = ['camera-access'];
            }

            navigator.xr.requestSession('immersive-ar', sessionOptions).then(onSessionStarted, onRequestSessionError);
        } else {
          xrSession.end();
        }
      }

      async function onSessionStarted(session) {
        xrSession = session;
        xrButton.innerHTML = 'Exit AR';
        updateSizes();

        session.addEventListener('end', onSessionEnded);

        if(document.getElementById('delay-after-start').checked) {
          await new Promise((resolve) => { setTimeout(() => {resolve()}, 5000) });
        }

        let canvas = document.createElement('canvas');
        gl = canvas.getContext('webgl', {
          xrCompatible: true
        });
        xrWebGLLayer = new XRWebGLLayer(session, gl);
        console.log(`XRWebGLLayer framebuffer size: ${xrWebGLLayer.framebufferWidth} x ${xrWebGLLayer.framebufferHeight}`);
        session.updateRenderState({ baseLayer: xrWebGLLayer });
        session.requestReferenceSpace('viewer').then((refSpace) => {
          xrRefSpace = refSpace;
          session.requestAnimationFrame(onXRFrame);
        });
      }

      function onRequestSessionError(ex) {
        alert("Failed to start immersive AR session.");
        console.error(ex.message);
      }

      function onEndSession(session) {
        session.end();
      }

      function onSessionEnded(event) {
        xrSession = null;
        xrButton.innerHTML = 'Enter AR';
        gl = null;

        updateSizes();
        latestWebXRViewportWidth = 0;
        latestWebXRViewportHeight = 0;
        webxrViewportSpan.innerText = '-';
      }

      function onXRFrame(t, frame) {
        updateSizes();

        let session = frame.session;
        session.requestAnimationFrame(onXRFrame);

        let viewerPose = frame.getViewerPose(xrRefSpace);
        if(!viewerPose) return;

        let xrView = viewerPose.views[0];
        if(!xrView) return;

        gl.bindFramebuffer(gl.FRAMEBUFFER, xrWebGLLayer.framebuffer);
        let xrViewport = xrWebGLLayer.getViewport(xrView);

        let {width, height} = xrViewport;
        if(width != latestWebXRViewportWidth || height != latestWebXRViewportHeight) {
          let sizeText = `${width} x ${height}`;
          console.log(`WebXR viewport size: ${sizeText}`);
          webxrViewportSpan.innerText = sizeText;
          latestWebXRViewportWidth = width;
          latestWebXRViewportHeight = height;
        }
        
        // Update the clear color so that we can observe the color in the
        // headset changing over time. Use a scissor rectangle to keep a border
        // fully transparent
        gl.enable(gl.SCISSOR_TEST);
        gl.scissor(xrViewport.x + 100, xrViewport.y + 100, xrViewport.width - 200, xrViewport.height - 200);
        let time = Date.now();
        gl.clearColor(Math.cos(time / 2000), Math.cos(time / 4000), Math.cos(time / 6000), 0.5);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
      }

      initXR();
    </script>
  </body>
</html>
